name: Build and test (Linux)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# CaDiCaL only for now. The other IPASIR backends are still selectable locally with
# -DIPASIR_SAT_SOLVER, but MergeSAT does not link here: libintel_sat_solver.a ships a
# Main.o defining main, and under that link order the linker pulls it in and collides
# with our own main. Worth fixing before putting the alternative backends back in CI.
jobs:
  build:
    name: CaDiCaL / g++-13
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 cmake make

      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DIPASIR_SAT_SOLVER=CADICAL

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Smoke test the CLI
        run: |
          ./build/hall_tool benchmarks/AND.aag /general/print_enumer 1
          ./build/hall_tool benchmarks/XOR.aag /general/print_enumer 1

      # Must run from the repository root, a few tests load files from benchmarks/.
      - name: Run library tests
        run: ./build/allsat_lib_tests

      - name: Build the standalone integration example
        run: |
          make -C standalone_test
          ./standalone_test/simple_test
